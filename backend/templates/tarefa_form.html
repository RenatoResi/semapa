{% extends "base.html" %}

{% block title %}{{ "Editar" if tarefa else "Nova" }} Tarefa{% endblock %}

{% block content %}
<h1>Sistema SEMAPA - {{ "Editar" if tarefa else "Cadastrar nova" }} tarefa</h1>

<section>
    <h2>{{ "Editar" if tarefa else "Nova" }} tarefa</h2>
    <form method="POST" autocomplete="off">
        <div class="form-row">
            <div class="form-group">
                <label for="requerimento_numero">Requerimento</label>
                <input type="text" id="requerimento_numero" name="requerimento_numero"
                    placeholder="Ex: 9999/2025"
                    value="{{ tarefa.requerimento_numero if tarefa else '' }}">
            </div>
            <div class="form-group">
                <label for="data_prevista">Data Prevista</label>
                <input type="date" id="data_prevista" name="data_prevista" required
                    value="{{ tarefa.data_prevista.strftime('%Y-%m-%d') if tarefa.data_prevista else '' }}">
            </div>
            <div class="form-group">
                <label for="periodo">Período</label>
                <select id="periodo" name="periodo">
                    <option value="">Selecione...</option>
                    <option value="manha" {% if tarefa and tarefa.periodo == 'manha' %}selected{% endif %}>Manhã</option>
                    <option value="tarde" {% if tarefa and tarefa.periodo == 'tarde' %}selected{% endif %}>Tarde</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="3" required>{{ tarefa.descricao if tarefa else "" }}</textarea>
            </div>
        </div>
        
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" class="form-control" value="{{ tarefa.endereco if tarefa else '' }}">
            </div>
            <div class="col-12 col-md-2">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" class="form-control" value="{{ tarefa.bairro if tarefa else '' }}">
            </div>
            <div class="col-12 col-md-2">
                <label for="latitude">Latitude</label>
                <input type="text" id="latitude" name="latitude" class="form-control" value="{{ tarefa.latitude if tarefa else '' }}">
            </div>
            <div class="col-12 col-md-2">
                <label for="longitude">Longitude</label>
                <input type="text" id="longitude" name="longitude" class="form-control" value="{{ tarefa.longitude if tarefa else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="complexidade">Complexidade</label>
                <select id="complexidade" name="complexidade">
                    <option value="">Selecione...</option>
                    <option value="1 - solo rapido" {% if tarefa and tarefa.complexidade == '1 - solo rapido' %}selected{% endif %}>1 - Solo Rápido</option>
                    <option value="2 - solo demorado" {% if tarefa and tarefa.complexidade == '2 - solo demorado' %}selected{% endif %}>2 - Solo Demorado</option>
                    <option value="3 - caminhao rapido" {% if tarefa and tarefa.complexidade == '3 - caminhao rapido' %}selected{% endif %}>3 - Caminhão Rápido</option>
                    <option value="4 - caminhao demorado" {% if tarefa and tarefa.complexidade == '4 - caminhao demorado' %}selected{% endif %}>4 - Caminhão Demorado</option>
                    <option value="5 - guindaste" {% if tarefa and tarefa.complexidade == '5 - guindaste' %}selected{% endif %}>5 - Guindaste</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade" name="prioridade">
                    {% for prio in ['baixa','normal','alta','urgente'] %}
                    <option value="{{ prio }}" {% if tarefa and tarefa.prioridade == prio %}selected{% endif %}>{{ prio | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for st in ['planejada','aprovada','reagendada','concluida','cancelada'] %}
                    <option value="{{ st }}" {% if tarefa and tarefa.status == st %}selected{% endif %}>{{ st | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="chefe_equipe_id">Chefe da Equipe</label>
                <select id="chefe_equipe_id" name="chefe_equipe_id" required>
                    <option value="">Selecione...</option>
                    {% for chefe in chefes %}
                    <option value="{{ chefe.id }}"
                        {% if tarefa and tarefa.chefe_equipe_id == chefe.id %}selected{% endif %}>
                        {{ chefe.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes">{{ tarefa.observacoes if tarefa else '' }}</textarea>
            </div>
        </div>

        <button type="submit">{% if tarefa %}Salvar{% else %}Cadastrar{% endif %}</button>
        <a href="{{ url_for('tarefas.listar_tarefas') }}" class="btn btn-secondary">Voltar</a>
    </form>
</section>

{% endblock %}

{% block scripts %}
<script>
document.getElementById("requerimento_numero").addEventListener("change", function () {
  var numeroCompleto = this.value.trim();
  if (!numeroCompleto) return;
  fetch('/api/requerimento?numero=' + encodeURIComponent(numeroCompleto))
    .then(response => {
      if (!response.ok) throw new Error('Requerimento não encontrado');
      return response.json();
    })
    .then(data => {
      if(data.descricao) document.querySelector('textarea[name="descricao"]').value = data.descricao;
      if(data.endereco) document.querySelector('input[name="endereco"]').value = data.endereco;
      if(data.bairro) document.querySelector('input[name="bairro"]').value = data.bairro;
      if(data.latitude) document.querySelector('input[name="latitude"]').value = data.latitude;
      if(data.longitude) document.querySelector('input[name="longitude"]').value = data.longitude;
      if(data.prioridade) document.querySelector('select[name="prioridade"]').value = data.prioridade.toLowerCase();
      if(data.observacoes) document.querySelector('textarea[name="observacoes"]').value = data.observacoes;
    })
    .catch(error => {
      alert(error.message);
    });
});
</script>
{% endblock %}
