{% extends "base.html" %}
{% block title %}{{ "Editar" if tarefa else "Nova" }} Tarefa{% endblock %}
{% block content %}

<div class="container-fluid py-4">
  <div class="mx-auto bg-white p-4 shadow-sm rounded-4" style="max-width: 1100px;">
    <h3 class="mb-4">
        {{ "Editar" if tarefa else "Cadastrar nova" }} tarefa
        {% if tarefa.reagendada and tarefa.reagendada > 0 %}
            <span class="badge bg-warning text-dark ms-2">R{{ tarefa.reagendada }}</span>
        {% endif %}
    </h3>

    <form method="POST" class="row g-3">
      <div class="col-12 col-md-6">
        <label for="requerimento_numero" class="form-label">Requerimento</label>
        <input type="text" id="requerimento_numero" name="requerimento_numero"
            class="form-control" placeholder="Ex: 9999/2025"
            value="{{ tarefa.requerimento_numero if tarefa else '' }}" required>
      </div>

      <div class="col-12 col-md-8">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3" required>{{ tarefa.descricao if tarefa else "" }}</textarea>
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Data Prevista</label>
        <input type="date" name="data_prevista" class="form-control" required
            value="{{ tarefa.data_prevista.strftime('%Y-%m-%d') if tarefa.data_prevista else '' }}">
      </div>

      <div class="row g-3">
        <div class="col-12 col-md-5">
            <label class="form-label">Endereço</label>
            <input type="text" name="endereco" class="form-control" value="{{ tarefa.endereco if tarefa else '' }}">
        </div>
        <div class="col-12 col-md-3">
            <label class="form-label">Bairro</label>
            <input type="text" name="bairro" class="form-control" value="{{ tarefa.bairro if tarefa else '' }}">
        </div>
        <div class="col-12 col-md-2">
            <label class="form-label">Latitude</label>
            <input type="text" name="latitude" class="form-control" value="{{ tarefa.latitude if tarefa else '' }}">
        </div>
        <div class="col-12 col-md-2">
            <label class="form-label">Longitude</label>
            <input type="text" name="longitude" class="form-control" value="{{ tarefa.longitude if tarefa else '' }}">
        </div>
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Período</label>
        <select name="periodo" class="form-select">
          <option value="">Selecione...</option>
          <option value="manha" {% if tarefa and tarefa.periodo == 'manha' %}selected{% endif %}>Manhã</option>
          <option value="tarde" {% if tarefa and tarefa.periodo == 'tarde' %}selected{% endif %}>Tarde</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Complexidade</label>
        <select name="complexidade" class="form-select">
          <option value="">Selecione...</option>
          <option value="1 - solo rapido" {% if tarefa and tarefa.complexidade == '1 - solo rapido' %}selected{% endif %}>1 - Solo Rápido</option>
          <option value="2 - solo demorado" {% if tarefa and tarefa.complexidade == '2 - solo demorado' %}selected{% endif %}>2 - Solo Demorado</option>
          <option value="3 - caminhao rapido" {% if tarefa and tarefa.complexidade == '3 - caminhao rapido' %}selected{% endif %}>3 - Caminhão Rápido</option>
          <option value="4 - caminhao demorado" {% if tarefa and tarefa.complexidade == '4 - caminhao demorado' %}selected{% endif %}>4 - Caminhão Demorado</option>
          <option value="5 - guindaste" {% if tarefa and tarefa.complexidade == '5 - guindaste' %}selected{% endif %}>5 - Guindaste</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Prioridade</label>
        <select name="prioridade" class="form-select">
          {% for prio in ['baixa','normal','alta','urgente'] %}
          <option value="{{ prio }}" {% if tarefa and tarefa.prioridade == prio %}selected{% endif %}>{{ prio | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for st in ['planejada','aprovada','reagendada','concluida','cancelada'] %}
          <option value="{{ st }}" {% if tarefa and tarefa.status == st %}selected{% endif %}>{{ st | capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Observações</label>
        <textarea name="observacoes" class="form-control">{{ tarefa.observacoes if tarefa else '' }}</textarea>
      </div>

      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-success">{% if tarefa %}Salvar{% else %}Cadastrar{% endif %}</button>
        <a href="{{ url_for('listar_tarefas') }}" class="btn btn-secondary">Voltar</a>
      </div>
    </form>
  </div>
</div>

<script>
document.getElementById("requerimento_numero").addEventListener("change", function () {
  var numeroCompleto = this.value.trim();
  if (!numeroCompleto) return;
  fetch('/api/requerimento?numero=' + encodeURIComponent(numeroCompleto))
    .then(response => {
      if (!response.ok) throw new Error('Requerimento não encontrado');
      return response.json();
    })
    .then(data => {
      if(data.descricao) document.querySelector('textarea[name="descricao"]').value = data.descricao;
      if(data.endereco) document.querySelector('input[name="endereco"]').value = data.endereco;
      if(data.bairro) document.querySelector('input[name="bairro"]').value = data.bairro;
      if(data.latitude) document.querySelector('input[name="latitude"]').value = data.latitude;
      if(data.longitude) document.querySelector('input[name="longitude"]').value = data.longitude;
      if(data.prioridade) document.querySelector('select[name="prioridade"]').value = data.prioridade.toLowerCase();
      if(data.observacoes) document.querySelector('textarea[name="observacoes"]').value = data.observacoes;
    })
    .catch(error => {
      alert(error.message);
    });
});
</script>

<style>
.container-fluid {
  background-color: #f4f6f9;
  min-height: 100vh;
  padding: 20px;
  box-sizing: border-box;
}

.bg-white {
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

form label {
  font-weight: 600;
  color: #333;
}

form input, form select, form textarea {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px;
  font-size: 15px;
  width: 100%;
  box-sizing: border-box;
}

form input:focus, form select:focus, form textarea:focus {
  border-color: #4CAF50;
  outline: none;
  box-shadow: 0 0 4px #4caf5044;
}

.btn {
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  text-decoration: none;
  font-weight: 500;
  cursor: pointer;
}

.btn-success {
  background-color: #4CAF50;
  color: white;
}

.btn-success:hover {
  background-color: #3e8e41;
}

.btn-secondary {
  background-color: #9e9e9e;
  color: white;
  margin-left: 10px;
}

.btn-secondary:hover {
  background-color: #7e7e7e;
}

.input-group {
  display: flex;
  align-items: center;
}

.input-group-text {
  background-color: #e9ecef;
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-left: none;
  border-radius: 0 6px 6px 0;
}

.row.g-3 {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

@media (max-width: 768px) {
  .row.g-3 > div {
    flex: 1 1 100%;
  }
  textarea {
    min-height: 120px;
  }
}
</style>

{% endblock %}
